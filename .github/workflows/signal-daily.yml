name: Signal Daily Digest

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  run-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Signal agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SIGNAL_FROM_EMAIL: ${{ secrets.SIGNAL_FROM_EMAIL }}
        run: python src/agent.py

      - name: Commit state files
        run: |
          git config user.name "Signal Bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add seen_articles.json signal_log.json
          git diff --cached --quiet || git commit -m "chore: update state after $(date -u +'%Y-%m-%d') run"
          git push
